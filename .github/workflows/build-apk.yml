# GitHub에 올리면 자동으로 APK를 만들어 'Releases'에 올려주는 설정
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MechParallaxWallpaper.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 APK
          body: 폰에서 아래 MechParallaxWallpaper.apk 를 눌러 설치하세요.
          files: MechParallaxWallpaper.apk
          make_latest: true
